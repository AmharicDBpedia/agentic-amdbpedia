# Published-image stack for end users.
#
# Pulls both multi-arch (linux/amd64, linux/arm64) images from the GitHub
# Container Registry and brings them up alongside PostgreSQL -- no source
# tree required. Workflow:
#
#   # one-time:
#   curl -LO https://github.com/AmharicDBpedia/agentic-amdbpedia/releases/latest/download/docker-compose.release.yml
#   cp .env.example .env  # fill GROQ_API_KEY and (optionally) bot credentials
#
#   # run (pin to a release):
#   TAG=v0.1.0 docker compose -f docker-compose.release.yml up -d
#
# `latest` works for a casual look but will drift; pin a `vX.Y.Z` for
# anything you expect to run again. For a specific release the Releases
# page also has a copy of this file at
# https://github.com/AmharicDBpedia/agentic-amdbpedia/releases/download/vX.Y.Z/docker-compose.release.yml
#
# Gemma (local LLM) is opt-in via the `local-llm` profile; the default stack
# uses Groq for every LLM call. See the README for the gemma pull.

services:
  backend:
    image: ghcr.io/amharicdbpedia/agentic-amdbpedia-backend:${TAG:-latest}
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL_FAST: ${GROQ_MODEL_FAST:-qwen/qwen3.8-27b}
      GROQ_MODEL_REASONING: ${GROQ_MODEL_REASONING:-qwen/qwen3.8-27b}
      PREDICT_MODEL: ${PREDICT_MODEL:-groq/qwen/qwen3.8-27b}
      PREDICT_FALLBACK_MODEL: ${PREDICT_FALLBACK_MODEL:-none}
      MEDIAWIKI_BOT_USERNAME: ${MEDIAWIKI_BOT_USERNAME:-}
      MEDIAWIKI_BOT_PASSWORD: ${MEDIAWIKI_BOT_PASSWORD:-}
      DATABASE_URL: postgresql+asyncpg://mapping_assistant:mapping_assistant@postgres:5432/mapping_assistant
    ports:
      - "8001:8001"
    volumes:
      # Keeps the ontology index and the embedding cache between restarts;
      # ~2 GB after the first run. Delete the volume to force a rebuild.
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/amharicdbpedia/agentic-amdbpedia-frontend:${TAG:-latest}
    environment:
      # The browser hits this URL directly, so it has to be reachable from
      # the host (not the Docker network name). Override for a remote host.
      PUBLIC_CROSS_LINGUAL_URL: ${PUBLIC_CROSS_LINGUAL_URL:-http://localhost:8001}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mapping_assistant
      POSTGRES_PASSWORD: mapping_assistant
      POSTGRES_DB: mapping_assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapping_assistant -d mapping_assistant"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # Opt-in local LLM. The ~5.4 GB gemma2:9b weights are NOT baked into the
  # image; pull them once after `docker compose --profile local-llm up -d`:
  #   docker compose exec ollama ollama pull gemma2:9b
  # Then switch the backend to it with
  #   PREDICT_MODEL=gemma2 PREDICT_FALLBACK_MODEL=groq/qwen/qwen3.8-27b
  # in .env and restart. Needs ~6.3 GB of free RAM on CPU-only hosts.
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    restart: unless-stopped

volumes:
  backend_data:
  postgres_data:
  ollama_models:
