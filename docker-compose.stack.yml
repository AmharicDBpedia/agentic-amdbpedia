# Single-command stack: optimized backend + frontend + postgres.
# Uses pre-built images (no rebuild). Boot with:
#   docker compose -f docker-compose.stack.yml up -d
# Requires a .env.stack file with GEMINI_API_KEY and GROQ_API_KEY.

services:
  backend:
    image: amdbpedia-backend:optimized
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env.stack}
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env.stack}
      GROQ_MODEL_FAST: ${GROQ_MODEL_FAST:-qwen/qwen3.8-27b}
      GROQ_MODEL_REASONING: ${GROQ_MODEL_REASONING:-qwen/qwen3.8-27b}
      PREDICT_MODEL: ${PREDICT_MODEL:-gemma4}
      PREDICT_FALLBACK_MODEL: ${PREDICT_FALLBACK_MODEL:-groq/qwen/qwen3.8-27b}
      DATABASE_URL: postgresql+asyncpg://mapping_assistant:mapping_assistant@postgres:5432/mapping_assistant
    ports:
      - "8001:8001"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: agentic-amdbpedia-frontend:optimized
    environment:
      # Browser-side URL -- resolved on the host, not inside the container,
      # so this must point at the backend's host-published port.
      PUBLIC_CROSS_LINGUAL_URL: ${PUBLIC_CROSS_LINGUAL_URL:-http://localhost:8001}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mapping_assistant
      POSTGRES_PASSWORD: mapping_assistant
      POSTGRES_DB: mapping_assistant
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapping_assistant -d mapping_assistant"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  backend_data:
  postgres_data:
