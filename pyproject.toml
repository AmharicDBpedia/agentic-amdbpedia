[project]
name = "agentic-amdbpedia"
version = "0.2.0"
description = "Amharic-to-English DBpedia ontology mapping assistant using hybrid RAG and MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "dspy>=3.3.1",
    "fastembed>=0.7.0",
    "groq>=0.31.0",
    "langgraph>=1.2.11",
    "litellm==1.98.0",
    # mcp 2.x renamed FastMCP to MCPServer and changed other APIs
    # (mcp_server/server.py imports `from mcp.server.fastmcp import
    # FastMCP` directly) -- an unbounded ">=1.10.0" is what let CI's
    # scheduled e2e-test job start failing every week once mcp 2.x
    # actually released: `--frozen` protects any *already-generated*
    # uv.lock, but the next plain `uv lock` was always going to be free
    # to resolve straight into 2.x again. `<2` makes that impossible
    # instead of relying on remembering to re-pin it by hand.
    "mcp[cli]>=1.10.0,<2",
    "mwparserfromhell>=0.7.2",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.0.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.1",
    "starlette>=1.3.1",
    "torch>=2.2",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "datasets>=5.0.1",
    "httpx>=0.28.1",
    "hypothesis>=6.135.0",
    "mypy>=1.16.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.2.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

# The embedding model only ever runs on CPU here (see EMBEDDING_DEVICE=cpu in
# config.py), so pull the CPU-only torch build instead of the multi-GB CUDA
# wheels sentence-transformers otherwise drags in as a transitive dependency
# (refs 10.2).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["config.py", "errors.py", "logging_config.py", "db", "rag", "mcp_server", "scripts", "tests"]

[[tool.mypy.overrides]]
module = [
    "datasets",
    "datasets.*",
    "dspy",
    "dspy.*",
    "fastembed",
    "fastembed.*",
    "sentence_transformers",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require network access to download real embedding models",
    "e2e: full end-to-end tests",
    "perf: scheduled latency budget benchmarks",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.coverage.run]
source = ["rag"]
